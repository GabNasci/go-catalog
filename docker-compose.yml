version: "3.9"

services:
  # go-app:
  #   container_name: go-app
  #   image: go-api-tutorial
  #   build: .
  #   ports:
  #     - "8000:8000"
  #   depends_on:
  #     - go_db
  go_db:
    container_name: go_db
    image: postgres:12
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "$DB_PORT:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: {}